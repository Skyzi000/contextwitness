name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      STAGE: contextwitness-${{ github.ref_name }}-windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate version
        shell: pwsh
        # The tag name is untrusted input: it reaches the script as an environment
        # variable, never by expansion into the script source.
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-about@0.9.2,cargo-audit
      - name: Third-party licenses
        shell: pwsh
        # cargo-about only warns when a clarification stops matching, and substitutes a license's
        # canonical text when a crate ships none, so neither fails the run by itself.
        run: |
          cargo about generate --locked --fail --format json -m crates/cw-daemon/Cargo.toml -o about.json 2> about.log
          if ($LASTEXITCODE -or (Get-Content about.log) -cmatch 'WARN|ERROR') { Get-Content about.log; exit 1 }
          $unsourced = (Get-Content about.json -Raw | ConvertFrom-Json).licenses |
            Where-Object { -not $_.source_path } |
            ForEach-Object { $id = $_.id; $_.used_by | ForEach-Object { "$($_.crate.name) $id" } } |
            Where-Object { $_ -ne 'libwebp-sys MIT' }
          if ($unsourced) { throw "no license text shipped by: $($unsourced -join ', ')" }
          cargo about generate --locked --fail -m crates/cw-daemon/Cargo.toml -o THIRD-PARTY-LICENSES.txt about.hbs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Tag pushes do not trigger ci.yml, so the tagged tree is verified here before it is published.
      - run: cargo fmt --all -- --check
      - name: Fetch the native libraries
        shell: pwsh
        run: ./scripts/fetch-sherpa-onnx.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo audit
      - run: cargo build --release
        env:
          # Portable ZIP promise: the exe must run on a machine without the VC++ redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Check that espeak-ng is not linked in
        shell: pwsh
        # The default sherpa-onnx archive links espeak-ng (GPL-3.0); the no-TTS one fetched above does not.
        run: |
          $exe = (Get-Item target/release/contextwitness.exe).FullName
          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($exe))
          $hits = [regex]::Matches($text, 'espeak[-_]ng', 'IgnoreCase').Count
          if ($hits) { throw "contextwitness.exe names espeak-ng $hits times" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:STAGE | Out-Null
          Copy-Item target/release/contextwitness.exe, README.md, README.ja.md, CHANGELOG.md, LICENSE, THIRD-PARTY-LICENSES.txt, THIRD-PARTY-NATIVE-LICENSES.txt $env:STAGE
          Copy-Item (Join-Path (rustc --print sysroot) share/doc/rust/COPYRIGHT-library.html) "$env:STAGE/RUST-STD-COPYRIGHT.html"
          Compress-Archive -Path $env:STAGE -DestinationPath "$env:STAGE.zip"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.STAGE }}.zip
          fail_on_unmatched_files: true
