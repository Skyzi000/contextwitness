name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      STAGE: contextwitness-${{ github.ref_name }}-windows-x86_64
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tag pushes do not trigger ci.yml, so the tagged tree is verified here before it is published.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
        env:
          # Portable ZIP promise: the exe must run on a machine without the VC++ redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:STAGE | Out-Null
          Copy-Item target/release/contextwitness.exe, README.md, LICENSE $env:STAGE
          Compress-Archive -Path $env:STAGE -DestinationPath "$env:STAGE.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.STAGE }}.zip
          fail_on_unmatched_files: true
