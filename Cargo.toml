[workspace]
resolver = "3"
members = [
    "crates/cw-core",
    "crates/cw-capture",
    "crates/cw-ocr",
    "crates/cw-store",
    "crates/cw-sink-hindsight",
    "crates/cw-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Skyzi000/contextwitness"

[workspace.dependencies]
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
toml = "0.9"
dirs = "6"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }
