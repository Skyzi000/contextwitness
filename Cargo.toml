[workspace]
resolver = "3"
members = [
    "crates/cw-core",
    "crates/cw-capture",
    "crates/cw-ocr",
    "crates/cw-store",
    "crates/cw-sink-hindsight",
    "crates/cw-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Skyzi000/contextwitness"

[workspace.dependencies]
cw-core = { path = "crates/cw-core" }
cw-capture = { path = "crates/cw-capture" }
cw-ocr = { path = "crates/cw-ocr" }
cw-store = { path = "crates/cw-store" }
cw-sink-hindsight = { path = "crates/cw-sink-hindsight" }
image = { version = "0.25", default-features = false }
webp = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value` so a stored metadata snapshot reaches the wire as the bytes it was stored as.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "3", features = ["serde"] }
toml = "1"
dirs = "6"
clap = { version = "4.6", features = ["derive"] }
winreg = "0.56"
tray-icon = "0.24"
tao = "0.36"
windows = { version = "0.62", features = [
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_Console",
    "Win32_Security",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Security_Cryptography",
    "Globalization",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
windows-capture = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
